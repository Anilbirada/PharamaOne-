<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PharmaOne | Medical Shop Management</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/analytics.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo" src="/pharmaone-logo.png" alt="PharmaOne — Your Health, Our Priority"></div>
    <nav>
      <button class="nav active" data-view="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav" data-view="pos">▣ <span>POS Billing</span></button>
      <button class="nav" data-view="medicines">◫ <span>Medicines</span></button>
      <button class="nav" data-view="sales">↗ <span>Sales & Invoices</span></button>
      <button class="nav" data-view="customers">♙ <span>Customers</span></button>
      <button class="nav" data-view="suppliers">♧ <span>Suppliers</span></button>
      <button class="nav" data-view="purchases">⇩ <span>Purchases</span></button>
      <button class="nav" data-view="returns">↩ <span>Returns</span></button>
      <button class="nav" data-view="reports">▤ <span>Reports</span></button>
      <button class="nav" data-view="expenses">₹ <span>Expenses</span></button>
      <button class="nav" data-view="alerts">⚑ <span>Alerts</span></button>
      <button class="nav" data-view="staff">♙ <span>Staff</span></button>
      <button class="nav" data-view="settings">⚙ <span>Settings</span></button>
      <button class="nav" data-view="transactions">≋ <span>Stock Audit</span></button>
    </nav>
    <div class="sidebar-bottom"><span class="online-dot"></span> Local demo workspace</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">YOUR HEALTH • OUR PRIORITY</div><h1 id="page-title">Dashboard</h1></div>
      <div class="top-actions"><span class="pill"><span class="online-dot"></span> System ready</span><div class="avatar">P</div></div>
    </header>
    <section id="app" aria-live="polite"><div class="loading">Loading PharmaOne…</div></section>
    <footer>PharmaOne MVP · Local development build · Not for live pharmacy operations</footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
  <script src="/analytics-dashboard.js"></script>
  <script src="/sales-history.js"></script>
</body>
</html>
